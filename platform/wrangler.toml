name = "neighbornoise"
main = "src/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "neighbornoise"
# Vervang door het id uit `wrangler d1 create neighbornoise` (zie DEPLOY.md)
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "neighbornoise-files"

[triggers]
crons = ["*/15 * * * *"]

[vars]
APP_URL = "http://localhost:8787"
MAIL_FROM = "NeighborNoise <noreply@neighbornoise.com>"
# RESEND_API_KEY zet je als secret: npx wrangler secret put RESEND_API_KEY
